name: Build AEROLINK APK

on:
  push:
    branches:
      - main
    paths:
      - "aerolink-phone/**"
      - ".github/workflows/aerolink-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      - name: Download MediaPipe hand model
        run: |
          mkdir -p aerolink-phone/app/src/main/assets
          curl -L --fail --retry 3 "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task" -o aerolink-phone/app/src/main/assets/hand_landmarker.task

      - name: Build APK
        working-directory: aerolink-phone
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp aerolink-phone/app/build/outputs/apk/debug/app-debug.apk dist/AEROLINK-v0.32.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AEROLINK-v0.32-apk
          path: dist/AEROLINK-v0.32.apk
          if-no-files-found: error
          retention-days: 14
